# Программа ЛР4 + Kafka. Одинакова у продюсера и у консьюмеров, роль задаётся в .env
name: lab4-app

services:
  app:
    build: ../TimeService
    image: aiprp-lab4-timeservice
    container_name: lab4-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8079}:8080"
    environment:
      KAFKA_ROLE: ${ROLE:?ROLE не задан, заполните .env}
      NODE_NAME: ${NODE_NAME:?NODE_NAME не задан}
      KAFKA_BOOTSTRAP: ${BROKER1_IP:?BROKER1_IP не задан}:9092,${BROKER2_IP:?BROKER2_IP не задан}:9092,${BROKER3_IP:?BROKER3_IP не задан}:9092
      KAFKA_TOPIC: lab4-messages
      # пусто = своя группа group-<NODE_NAME>, каждый консьюмер получает все сообщения
      KAFKA_GROUP: ${KAFKA_GROUP:-}
