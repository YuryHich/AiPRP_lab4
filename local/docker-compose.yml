# Вся система на ОДНОМ компьютере: 3 брокера + продюсер + 3 консьюмера.
# Нужен для проверки дома перед занятием. Запуск из папки local: docker compose up -d --build
#   продюсер:    http://localhost:8090/TimeService/kafka/producer.html
#   консьюмеры:  http://localhost:8091, 8092, 8093 /TimeService/kafka/consumer.html
name: lab4-local

x-kafka-env: &kafka-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

x-app: &app
  build: ../TimeService
  image: aiprp-lab4-timeservice
  depends_on: [kafka1, kafka2, kafka3]

x-app-env: &app-env
  KAFKA_BOOTSTRAP: kafka1:9092,kafka2:9092,kafka3:9092
  KAFKA_TOPIC: lab4-messages
  # эксперимент: set KAFKA_GROUP=shared и docker compose up -d -> консьюмеры делят сообщения
  KAFKA_GROUP: ${KAFKA_GROUP:-}

services:
  kafka1:
    image: apache/kafka:3.9.0
    container_name: kafka1
    ports: ["19092:19092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092,EXTERNAL://localhost:19092

  kafka2:
    image: apache/kafka:3.9.0
    container_name: kafka2
    ports: ["19093:19093"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092,EXTERNAL://localhost:19093

  kafka3:
    image: apache/kafka:3.9.0
    container_name: kafka3
    ports: ["19094:19094"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092,EXTERNAL://localhost:19094

  producer:
    <<: *app
    container_name: producer
    ports: ["8090:8080"]
    environment:
      <<: *app-env
      KAFKA_ROLE: producer
      NODE_NAME: producer

  consumer1:
    <<: *app
    container_name: consumer1
    ports: ["8091:8080"]
    environment:
      <<: *app-env
      KAFKA_ROLE: consumer
      NODE_NAME: consumer1

  consumer2:
    <<: *app
    container_name: consumer2
    ports: ["8092:8080"]
    environment:
      <<: *app-env
      KAFKA_ROLE: consumer
      NODE_NAME: consumer2

  consumer3:
    <<: *app
    container_name: consumer3
    ports: ["8093:8080"]
    environment:
      <<: *app-env
      KAFKA_ROLE: consumer
      NODE_NAME: consumer3
