<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="ru">
<head>
<title>WebSocket chat</title>
<style type="text/css"><![CDATA[
input#chat { width: 410px }
.div-1 { background-color: #ABEBEF; }
#console-container { width: 400px; }
#console {
  border: 1px solid #CCCCCC;
  height: 170px;
  overflow-y: scroll;
  padding: 5px;
  width: 100%;
}
#console p { padding: 0; margin: 0; }
]]></style>
<script type="application/javascript"><![CDATA[
"use strict";
var Chat = {};
Chat.socket = null;
Chat.connect = (function(host) {
    if ('WebSocket' in window) {
        Chat.socket = new WebSocket(host);
    } else if ('MozWebSocket' in window) {
        Chat.socket = new MozWebSocket(host);
    } else {
        Console.log('Error: WebSocket is not supported by this browser.');
        return;
    }
    Chat.socket.onopen = function () {
        Console.log('Info: WebSocket connection opened.');
        document.getElementById('chat').onkeydown = function(event) {
            if (event.keyCode == 13) {
                Chat.sendMessage();
            }
        };
    };
    Chat.socket.onclose = function () {
        document.getElementById('chat').onkeydown = null;
        Console.log('Info: WebSocket closed.');
    };
    Chat.socket.onmessage = function (message) {
        Console.log(message.data);
    };
});
Chat.initialize = function() {
    var scheme = window.location.protocol == 'https:' ? 'wss://' : 'ws://';
    Chat.connect(scheme + window.location.host + '/TimeService/websocket/chat');
};
Chat.sendMessage = (function() {
    var message = document.getElementById('chat').value;
    if (message != '') {
        Chat.socket.send(message);
        document.getElementById('chat').value = '';
    }
});
var Console = {};
Console.log = (function(message) {
    var console = document.getElementById('console');
    var p = document.createElement('p');
    p.style.wordWrap = 'break-word';
    p.innerHTML = message;
    console.appendChild(p);
    while (console.childNodes.length > 25) {
        console.removeChild(console.firstChild);
    }
    console.scrollTop = console.scrollHeight;
});
Chat.initialize();
]]></script>
</head>
<body>
<div>
<p>Напишите <b>time</b> — текущее время. Слово из словаря (<b>кот</b>, <b>dog</b>) — перевод. Остальное уходит в чат.</p>
<p><input type="text" size="80" id="chat" /></p>
<div id="console-container">
<div id="console" class="div-1"></div>
</div>
</div>
</body>
</html>
