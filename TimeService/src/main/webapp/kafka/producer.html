<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Kafka: продюсер</title>
    <style>
        body { font-family: Segoe UI, Arial, sans-serif; margin: 24px; max-width: 900px; }
        textarea { width: 100%; height: 220px; font-family: Consolas, monospace; }
        .info { background: #f3f3f3; padding: 8px 12px; border-radius: 6px; font-family: Consolas, monospace; }
        .ok { color: #1a7f37; }
        .err { color: #c62828; }
        button { padding: 8px 18px; font-size: 15px; }
        #log div { border-bottom: 1px solid #ddd; padding: 4px 0; }
    </style>
</head>
<body>
    <h1>Kafka: продюсер</h1>
    <p><a href="../index.html">← на главную</a> | <a href="consumer.html">страница консьюмера</a></p>
    <div class="info" id="info">загрузка настроек...</div>

    <h3>Сообщение</h3>
    <p>
        <label><input type="radio" name="type" value="html" checked> HTML</label>
        <label><input type="radio" name="type" value="text"> обычный текст</label>
        &nbsp;&nbsp; Загрузить HTML-файл: <input type="file" id="file" accept=".html,.htm,.txt">
    </p>
    <textarea id="text"><h2 style="color:#1565c0">Привет от продюсера!</h2>
<p>Это <b>HTML-сообщение</b>, отправленное через <i>Apache Kafka</i>.</p>
<ul>
  <li>топик: lab4-messages</li>
  <li>3 брокера, 3 консьюмера</li>
</ul></textarea>
    <p><button id="send">Отправить в Kafka</button></p>

    <h3>Журнал отправки</h3>
    <div id="log"></div>

<script>
    fetch('../api/kafka/info').then(r => r.json()).then(i => {
        document.getElementById('info').textContent =
            'узел: ' + i.node + ' | роль: ' + i.role + ' | брокеры: ' + i.bootstrap + ' | топик: ' + i.topic;
    }).catch(e => { document.getElementById('info').textContent = 'не удалось получить настройки: ' + e; });

    document.getElementById('file').addEventListener('change', function () {
        const f = this.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = () => {
            document.getElementById('text').value = reader.result;
            document.querySelector('input[value=html]').checked = true;
        };
        reader.readAsText(f, 'UTF-8');
    });

    function log(text, cls) {
        const d = document.createElement('div');
        d.className = cls;
        d.textContent = new Date().toLocaleTimeString() + '  ' + text;
        const l = document.getElementById('log');
        l.insertBefore(d, l.firstChild);
    }

    document.getElementById('send').addEventListener('click', function () {
        const btn = this;
        const body = new URLSearchParams();
        body.append('text', document.getElementById('text').value);
        body.append('type', document.querySelector('input[name=type]:checked').value);
        btn.disabled = true;
        fetch('../api/kafka/send', { method: 'POST', body: body })
            .then(r => r.json())
            .then(res => {
                if (res.ok) log('отправлено: топик ' + res.topic + ', партиция ' + res.partition + ', offset ' + res.offset, 'ok');
                else log('ошибка: ' + res.error, 'err');
            })
            .catch(e => log('ошибка: ' + e, 'err'))
            .finally(() => { btn.disabled = false; });
    });
</script>
</body>
</html>
