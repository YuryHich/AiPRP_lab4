# Один брокер Kafka (он же контроллер KRaft) на одном компьютере.
# Такой же файл запускают все три компьютера-брокера, отличается только .env
name: kafka-broker

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: ${CONTAINER_NAME:-kafka-broker}
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-9092}:9092"     # клиенты: продюсер, консьюмеры, другие брокеры
      - "${CONTROLLER_PORT:-9093}:9093" # голосование контроллеров KRaft
    environment:
      # общий для всех трёх брокеров идентификатор кластера (не секрет)
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: ${NODE_ID:?NODE_ID не задан, заполните .env}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # адрес, который брокер сообщает клиентам: IP этого компьютера в общей сети
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${MY_IP:?MY_IP не задан}:${CLIENT_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@${BROKER1_IP:?BROKER1_IP не задан}:${BROKER1_CONTROLLER_PORT:-9093},2@${BROKER2_IP:?BROKER2_IP не задан}:${BROKER2_CONTROLLER_PORT:-9093},3@${BROKER3_IP:?BROKER3_IP не задан}:${BROKER3_CONTROLLER_PORT:-9093}
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
